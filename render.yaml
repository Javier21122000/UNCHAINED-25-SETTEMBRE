# Blueprint Render: backend Dockerizzato, PostgreSQL gestito e frontend statico.
# Deve stare nella RADICE del repository: è qui che Render lo cerca.
# Gli URL tra servizi sono riferimenti Render: nessun valore manuale al primo deploy.

databases:
  - name: autodealer-db
    databaseName: autodealer
    user: autodealer
    plan: free
    region: frankfurt

services:
  # ------------------------------------------------------------------ backend
  - type: web
    name: autodealer-backend
    runtime: docker
    plan: free
    region: frankfurt
    # Percorsi relativi alla radice del repository
    dockerfilePath: ./BACKEND/Dockerfile
    dockerContext: ./BACKEND
    # Render considera il servizio sano solo quando questo endpoint risponde 200 (è permitAll)
    healthCheckPath: /actuator/health
    envVars:
      # Connessione al database, iniettata da Render nel formato postgres://...
      # DatabaseUrl.java la traduce in URL JDBC all'avvio.
      - key: DATABASE_URL
        fromDatabase:
          name: autodealer-db
          property: connectionString

      # Chiave di firma JWT generata da Render: almeno 32 caratteri
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "3600000"
      - key: JWT_ISSUER
        value: UNCHAINED-25-SETTEMBRE

      # Indirizzo esatto del frontend, senza barra finale.
      # NON si può usare fromService qui: puntando al static site, RENDER_EXTERNAL_URL non
      # si risolve e la variabile resta indefinita. Il backend ricade allora sul valore di
      # ripiego http://localhost:5173 e il preflight CORS del sito pubblicato torna 403.
      # Va inserita a mano in dashboard: https://autodealer-frontend.onrender.com
      - key: ALLOWED_ORIGIN
        sync: false
      # URL pubblico di QUESTO servizio: compone il link di disiscrizione nelle mail
      - key: APP_BASE_URL
        fromService:
          name: autodealer-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

      # Amministratore iniziale, creato al primo avvio se non esiste già un ADMIN.
      # Senza ADMIN_PASSWORD non viene creato nessun amministratore.
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        value: admin@autodealer.local
      - key: ADMIN_PASSWORD
        # Credenziale di progettazione documentata in progettazione.md.
        value: pswjaviunchained

      # Resend usa HTTPS e funziona anche sui servizi Render che bloccano le porte SMTP.
      - key: MAIL_ENABLED
        value: "true"
      - key: MAIL_PROVIDER
        value: resend
      - key: MAIL_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

      # In produzione lo schema andrebbe gestito con migrazioni versionate (Flyway/Liquibase)
      - key: JPA_DDL_AUTO
        value: update

  # ----------------------------------------------------------------- frontend
  - type: web
    name: autodealer-frontend
    runtime: static
    rootDir: FRONTEND
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Vite 8 richiede Node ^20.19 o >=22.12: senza questo Render userebbe una versione più vecchia
      - key: NODE_VERSION
        value: 24.15.0
      # URL del backend, letto al momento della build da src/lib/api.ts
      - key: VITE_API_URL
        fromService:
          name: autodealer-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      # App a pagina singola: senza questa regola /login, /admin e /catalogo
      # restituirebbero 404 al caricamento diretto o al refresh, perché a quei
      # percorsi non corrisponde nessun file dentro dist/.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; connect-src 'self' https://autodealer-backend.onrender.com; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        # I nomi dei file di dist/assets contengono l'hash del contenuto: sicuri da tenere in cache
        value: public, max-age=31536000, immutable
