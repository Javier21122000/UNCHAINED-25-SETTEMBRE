spring.application.name=UNCHAINED-25-SETTEMBRE

# Database PostgreSQL
# Su Render la connessione arriva da DATABASE_URL, tradotta in JDBC da DatabaseUrl.java.
# Questi valori restano il ripiego per lo sviluppo locale.
# DB_NAME conserva il nome originale: e' il database che esiste davvero in locale.
# Rinominarlo qui farebbe fallire l'avvio finche' non si rinomina anche in Postgres.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:autodealer-25-settembre}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Configurazione Email (Gmail SMTP con valori di ripiego per dev locale)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${MAIL_FROM:noreply@unchained.com}
# URL pubblico del backend: usato per comporre il link di disiscrizione nelle mail
app.mail.base-url=${APP_BASE_URL:http://localhost:8080}
# In dev le mail vengono solo loggate: nessuna connessione SMTP
app.mail.enabled=${MAIL_ENABLED:false}

# Security JWT
# Nessun valore di ripiego: una chiave scritta nel repository sarebbe nota a chiunque
# e permetterebbe di forgiare token validi. In locale: export JWT_SECRET=...
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.issuer=${JWT_ISSUER:UNCHAINED-25-SETTEMBRE}

# Origini frontend, separate da virgola. ALLOWED_ORIGIN e' il nome usato dalla consegna,
# CORS_ALLOWED_ORIGINS resta accettato come alias.
app.cors.allowed-origins=${ALLOWED_ORIGIN:${CORS_ALLOWED_ORIGINS:http://localhost:5173}}

# Amministratore iniziale: la password arriva solo da ADMIN_PASSWORD, senza ripiego.
# Se non e' impostata non viene creato nessun admin.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@unchained.local}
app.admin.password=${ADMIN_PASSWORD:}

# Sicurezza Errori
server.error.include-message=never
server.error.include-stacktrace=never
# Actuator: solo health esposto, dettagli visibili ai soli ADMIN autenticati
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
# Render usa /actuator/health come health check: deve riflettere la salute DELL'APPLICAZIONE.
# Un SMTP irraggiungibile non impedisce di sfogliare il catalogo e un fallimento d'invio e' gia'
# gestito (claim rilasciato, avviso ritentabile): se pesasse sullo health, un Gmail lento
# farebbe fallire il deploy o riavviare un servizio sano. Il database invece resta indispensabile.
management.health.mail.enabled=false

# Porta (Render fornisce PORT a runtime)
server.port=${PORT:8080}
