# Database isolato: i test non leggono e non modificano PostgreSQL locale.
spring.datasource.url=jdbc:h2:mem:autodealer-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Valori finti, validi solo per i test: i segreti veri non stanno nel repository.
jwt.secret=chiaveDiTestLunga32ByteAbbastanzaXYZ
app.admin.password=
app.mail.enabled=false
